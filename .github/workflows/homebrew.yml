name: Homebrew tap

on:
  pull_request:
    paths:
      - "Casks/mcp-safari.rb"
      - "Formula/mcp-safari-server.rb"
      - "Formula/pmetal.rb"
      - ".github/workflows/homebrew.yml"
  push:
    branches: ["main"]
    paths:
      - "Casks/mcp-safari.rb"
      - "Formula/mcp-safari-server.rb"
      - "Formula/pmetal.rb"
      - ".github/workflows/homebrew.yml"
  schedule:
    # Weekly, so a moved tag or a changed source archive shows up before a user hits it.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap and trust this checkout
        run: |
          brew tap epistates/tap "$GITHUB_WORKSPACE"
          brew trust --tap epistates/tap

      - name: Lint formulae and cask
        run: |
          ruby -c Formula/mcp-safari-server.rb
          ruby -c Formula/pmetal.rb
          ruby -c Casks/mcp-safari.rb
          brew style ./Formula/mcp-safari-server.rb ./Formula/pmetal.rb ./Casks/mcp-safari.rb
          brew audit --formula epistates/tap/mcp-safari-server --online
          brew audit --formula --strict epistates/tap/pmetal --online
          brew audit --cask epistates/tap/mcp-safari --online

      - name: Fetch pmetal's source and check its sha256
        run: brew fetch --build-from-source --formula epistates/tap/pmetal

  formula-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap and trust this checkout
        run: |
          brew tap epistates/tap "$GITHUB_WORKSPACE"
          brew trust --tap epistates/tap

      - name: Install formula and run packaging test
        run: |
          brew install --formula epistates/tap/mcp-safari-server
          brew test epistates/tap/mcp-safari-server

  cask-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap and trust this checkout
        run: |
          brew tap epistates/tap "$GITHUB_WORKSPACE"
          brew trust --tap epistates/tap

      - name: Install cask and verify server link
        run: |
          brew install --cask epistates/tap/mcp-safari

          server_bin="$(brew --prefix)/bin/mcp-safari"
          test -x "$server_bin"

          link_target="$(readlink "$server_bin")"
          case "$link_target" in
            ../Cellar/mcp-safari-server/*/bin/mcp-safari) ;;
            *)
              echo "Unexpected mcp-safari link target: $link_target"
              exit 1
              ;;
          esac

  pmetal-lifecycle:
    runs-on: macos-latest
    # pmetal builds MLX from source; there is no bottle.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap and trust this checkout
        run: |
          brew tap epistates/tap "$GITHUB_WORKSPACE"
          brew trust --tap epistates/tap

      - name: Install Xcode's Metal Toolchain
        # MLX compiles its kernels with the Metal compiler, a separate Xcode
        # component since Xcode 26. The image installs it, but some runners come
        # up without it (actions/runner-images#14013).
        run: |
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk macosx metal --version
          fi

      - name: Build pmetal from source and run its test
        run: |
          brew install --build-from-source --formula epistates/tap/pmetal
          brew test epistates/tap/pmetal
