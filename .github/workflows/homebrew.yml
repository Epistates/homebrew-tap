name: Homebrew tap

on:
  pull_request:
    paths:
      - "Casks/mcp-safari.rb"
      - "Formula/mcp-safari-server.rb"
      - ".github/workflows/homebrew.yml"
  push:
    branches: ["main"]
    paths:
      - "Casks/mcp-safari.rb"
      - "Formula/mcp-safari-server.rb"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap checkout
        run: |
          brew untap epistates/tap || true
          brew tap epistates/tap "$GITHUB_WORKSPACE"

      - name: Lint formula and cask
        run: |
          ruby -c Formula/mcp-safari-server.rb
          ruby -c Casks/mcp-safari.rb
          brew style ./Formula/mcp-safari-server.rb ./Casks/mcp-safari.rb
          brew audit --formula epistates/tap/mcp-safari-server --online
          brew audit --cask epistates/tap/mcp-safari --online

  formula-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap checkout
        run: |
          brew untap epistates/tap || true
          brew tap epistates/tap "$GITHUB_WORKSPACE"

      - name: Install formula and run packaging test
        run: |
          brew install --formula epistates/tap/mcp-safari-server
          brew test epistates/tap/mcp-safari-server

  cask-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tap checkout
        run: |
          brew untap epistates/tap || true
          brew tap epistates/tap "$GITHUB_WORKSPACE"

      - name: Install cask and verify server link
        run: |
          brew install --cask epistates/tap/mcp-safari

          server_bin="$(brew --prefix)/bin/mcp-safari"
          test -x "$server_bin"

          link_target="$(readlink "$server_bin")"
          case "$link_target" in
            ../Cellar/mcp-safari-server/*/bin/mcp-safari) ;;
            *)
              echo "Unexpected mcp-safari link target: $link_target"
              exit 1
              ;;
          esac
